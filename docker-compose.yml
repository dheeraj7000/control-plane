name: control-plane

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: control_plane
      POSTGRES_PASSWORD: control_plane
      POSTGRES_DB: control_plane
    ports:
      - "55432:5432" # host-side port bumped to avoid colliding with a local Postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control_plane -d control_plane"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379" # host-side port bumped to avoid colliding with a local Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"] # JetStream + HTTP monitoring (used by healthcheck below); event log durability lands in Milestone 3
    ports:
      - "4222:4222" # client connections
      - "8222:8222" # HTTP monitoring
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: deployments/server.Dockerfile
    environment:
      APP_ENV: development
      HTTP_PORT: 8080
      DATABASE_URL: postgres://control_plane:control_plane@postgres:5432/control_plane?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER: stdout
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: deployments/dashboard.Dockerfile
      args:
        # localhost:8080, not http://server:8080 — this URL is called
        # from the user's browser, not container-to-container, and the
        # browser can't resolve the compose network's service names.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  postgres_data:
